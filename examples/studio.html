<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Montserrat&display=swap" rel="stylesheet">
<style>body{margin:0;}</style>
</head>
<body>
<div id="myContainer"></div>
<script>
function drawHtmlGridText({
  rows=6,
  cols=6,
  cellSize=40,
  palette=["black"],
  text="",
  elementId="",
  fontFamily="Rubik Mono One" // switch here if you like: "Montserrat"
}){
  let e=document.getElementById(elementId);
  e.style.cssText=
    `display:grid;grid-template-columns:repeat(${cols},${cellSize}px);`+
    `width:${cols*cellSize}px;height:${rows*cellSize}px;`+
    `font-family:'${fontFamily}', sans-serif;font-size:${cellSize}px;text-align:center;`+
    `justify-items:center;align-items:center;position:relative;`+
    `border:1px solid black;`+
    `background:
     repeating-linear-gradient(to right,transparent,transparent ${cellSize-1}px,black ${cellSize-1}px,black ${cellSize}px),
     repeating-linear-gradient(to bottom,transparent,transparent ${cellSize-1}px,black ${cellSize-1}px,black ${cellSize}px);`;

  let r=0,c=0,col=palette[0];
  for(let i=0;i<text.length;i++){
    let h=text[i];
    if(h==='\\'){let idx=parseInt(text[++i],10);if(!isNaN(idx)&&idx<palette.length)col=palette[idx];continue;}
    if(c>=cols||h==='\n'){c=0;r++;if(r>=rows)break;}
    let d=document.createElement('div');
    d.style.display='flex';
    d.style.justifyContent='center';
    d.style.alignItems='center';
    d.style.width=cellSize+'px';
    d.style.height=cellSize+'px';
    if(h!==' '&&h!=='\n') { d.style.color=col; d.textContent=h; }
    e.appendChild(d);
    c++;
  }
}

// Example:
drawHtmlGridText({
  rows:6,
  cols:6,
  cellSize:40,
  palette:["black","#3a7fa4","#9C2222","#006400","#CCCCCC"],
  text:"STUDIO\\1CODE\\2+   \\3WOOD          \\4AR     T                  ",
    elementId:"myContainer",
  //fontFamily:"Century Gothic"
});
</script>
</body>
</html>
